name: Feature request
description: Suggest a new capability or change in behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. If you'd like to build it yourself, say so and
        we'll help rather than duplicate the work.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered?
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: I'd be happy to open a pull request for this
          required: false
